<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ant atlas</title>
<style>
  :root {
    --bg: #0a0b0d; --ink: #e8e6df; --muted: #8b8a84; --line: #26282d;
    --accent: #69a621; --warn: #d861aa; --calm: #259cde; --panel: #111316;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 13px/1.5 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace; }
  #top { position: fixed; left: 0; right: 0; top: 0; height: 52px; padding: 0 20px; display: flex;
    align-items: center; gap: 24px; }
  #name { font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
  #why { flex: 1; min-width: 0; color: var(--muted); font-size: 11px; line-height: 14px; max-height: 42px; overflow: hidden; }
  #totals { display: flex; gap: 20px; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  #totals b { color: var(--ink); font-weight: 400; }
  /* a narrow window: the totals go one above the other (four lines in the strip's 52 px), so the sentence keeps its room;
     narrower still, it loses its middle part, and then its last sentence */
  @media (max-width: 1559px) { #totals { flex-direction: column; align-items: flex-end; gap: 0; font-size: 11px; line-height: 13px; } }
  @media (max-width: 999px) { #why .more { display: none; } }
  @media (max-width: 799px) { #why .last { display: none; } }
  #grid { position: fixed; left: 0; right: 0; top: 52px; bottom: 56px; padding: 2px 12px 12px; display: grid; gap: 8px; }
  .p { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px 6px; display: flex; flex-direction: column;
    min-width: 0; min-height: 0; overflow: hidden; }
  .p.ok { border-color: #34500f; } .p.rep { border-color: #6b3155; } .p.nev { border-color: #17506f; }
  .hd { min-height: 20px; display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; }
  .rule { font-weight: 600; letter-spacing: .08em; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .rule.long { font-size: 9px; line-height: 10px; letter-spacing: 0; white-space: normal; word-break: break-all; align-self: center; }
  .word { color: var(--muted); font-size: 11px; padding-left: 8px; }
  .word.ok { color: var(--accent); } .word.rep { color: var(--warn); } .word.nev { color: var(--calm); } .word.off { color: var(--ink); }
  .pic { flex: 1; min-height: 0; position: relative; }
  .pic canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .ft { height: 42px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--muted);
    font-size: 10px; line-height: 14px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
  .ft .two { display: flex; justify-content: space-between; }
  #tip { position: fixed; display: none; pointer-events: none; z-index: 5; background: #16181c; border: 1px solid #3a3d44;
    border-radius: 5px; padding: 6px 9px; font-size: 12px; font-variant-numeric: tabular-nums;
    white-space: pre-wrap; width: max-content; max-width: calc(100vw - 16px); }   /* a line wraps only when the window is narrower than it */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; padding: 0 20px; display: flex;
    align-items: center; gap: 16px; background: var(--panel); border-top: 1px solid var(--line);
    overflow-x: auto; white-space: nowrap; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sl { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .sl input[type=range] { width: 160px; accent-color: var(--accent); }
  .sl input[type=text] { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    padding: 7px 10px; border-radius: 6px; width: clamp(27ch, 100vw - 760px, 58ch); text-transform: uppercase; letter-spacing: .06em; }
  .sl input[type=text]::placeholder { color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 11px; }
  .sl input.bad { border-color: var(--warn); }
  .sl span { color: var(--ink); min-width: 30px; font-variant-numeric: tabular-nums; }
  .spd { margin-left: auto; }
  .spd span { min-width: 160px; }
  .spd span.set { color: var(--muted); }
</style>
</head>
<body>
<div id="top">
  <div id="name">ant atlas</div>
  <div id="why">A panel says proved only after the page has checked that its ant repeats for ever. <span class="more">From then on the ant is not simulated: its place is worked out. </span><span class="last">Rules that start with L are mirror images, which is why the short ones all start with R.</span></div>
  <div id="totals"><span>proved <b id="tp"></b></span><span title="A 1995 theorem: an ant whose rule, read as a cycle, is made of runs of even length comes back to its start again and again for ever when it starts on the blank grid. So it never builds a highway">never a highway (theorem) <b id="tn"></b></span><span>simulated <b id="ts"></b></span><span>skipped <b id="tk"></b></span></div>
</div>

<div id="grid"></div>
<div id="tip"></div>

<div id="ui">
  <label class="sl">rule <input id="rule" type="text" maxlength="24" placeholder="L and R, 2 to 24 letters. Try one that starts like a proved ant" title="L and R, 2 to 24 letters. Try one that starts like a proved ant" spellcheck="false" autocomplete="off"></label>
  <button id="add">add</button>
  <label class="sl spd">speed <input id="spd" type="range" min="0" max="1000" value="480"><span id="rate"></span></label>
  <button id="pause">pause</button>
  <button id="again">restart</button>
</div>

<script>
// =====================================================================================
// THE RULES. Nothing in this block draws or touches the page, so it can move to a game
// engine as it is. An ant is plain data; advance(ant, k) moves its clock k steps on.
//
// The ant. A grid of cells, all colour 0 at the start. A rule is a string of L and R,
// one letter per colour. One step: read the colour under the ant, turn the way the rule
// says for that colour (R right, L left), give the cell its next colour (after the last
// colour comes 0 again), move one cell forward.
//
// The proof. Some ants end up doing the same p steps again and again, moved by a fixed
// shift each time: a highway. Seeing it repeat proves nothing: some ants do the same
// steps dozens of times in a row and then stop (the checks name one). So certify() does
// not count repeats. It takes the last p steps, lists the cells they read, and looks
// AHEAD along the shift: will the next round find on each of its cells the colour the
// last round found there? And the round after that, counting what the rounds before it
// leave behind? It follows the strip ahead until it is outside the box of everything
// the ant ever touched. Out there every cell is 0 and nothing can differ any more. If
// every round checks out, the ant repeats for ever: each round is the last one again,
// one shift further on. If a round does not check out, the same sum gives the exact
// step at which the repeat ends.
//
// The looks. The detector looks at set step counts, on two timetables: a quick look for
// short periods every few hundred steps, and a full look for every period, rarer as the
// ant gets older. A repeat that the check refused stays in ant.repeat until the step it
// ends. Each look notes one refused repeat (the one that ends latest), and ant.fake keeps
// the noted one that covers the most steps: what a detector that counts repeats would
// have fallen for. It is no record of the ant: a short repeat can begin and end between
// two looks, unseen.
//
// The jump. A proved ant is not simulated any more. Where it is after N steps is one
// line of arithmetic: positionAt(ant, N).
//
// The same ant. Write a rule again and again without end: its endless word. A cell that
// was visited v times shows colour v mod n, so the next visit turns by letter number v
// of the endless word. Every cell's visits are counted (ant.vis). An ant that visits no
// cell more than V times only ever reads letters 0 to V-1, so any rule whose endless
// word starts with the same V letters makes the same moves. For a proved highway V is
// worked out for the whole endless run (proof.letters). copyAnt() then gives a rule
// with the same start the same proof, with no step simulated.
//
// Never a highway. For some rules part of the answer is known before the first step. Read
// a rule as a cycle (after its last letter comes its first). If it is made of runs of L
// and runs of R that all have even length (LLRR, RLLR, LLRRRR), a theorem says that its ant,
// started on the blank grid, comes back to its start cell again and again for ever (1995,
// "Further travels with my ant"). An ant on a highway leaves its start for ever, so such
// an ant never builds one. evenRuns() reads this off the rule. It proves nothing by
// itself and changes nothing in the detector: the page only counts how often the ant is
// back (ant.homeVisits, ant.lastHome).
// =====================================================================================
// Headings: 0 up, 1 right, 2 down, 3 left. y grows down.
const HIST = 32768, HIST_MASK = HIST - 1;       // steps an ant remembers (a power of two)
const MAX_PERIOD = 8192;                        // longest period the detector looks for
const QUICK_EVERY = 256, QUICK_PERIOD = 128;    // the quick look: every 256 steps, periods up to 128
const START_SIDE = 256, MAX_SIDE = 4096;        // the grid doubles from the first to the second
const BORDER = 2;                               // the ant never stands closer to the edge than this

// a rule typed by hand: 2 to 24 letters, only L and R
function validRule(text) {
  const rule = String(text).trim().toUpperCase();
  return /^[LR]{2,24}$/.test(rule) ? rule : null;
}

// Is the rule, read as a cycle, made of runs of L and runs of R that all have even length?
// (RLLR: the run RR goes around the end.) A rule with one letter only has no runs of both: false.
// For such a rule a theorem says the ant never builds a highway from the blank grid (see the banner).
function evenRuns(rule) {
  const n = rule.length;
  let first = 0;   // a place where a run begins: its letter differs from the one before it, around the end
  while (first < n && rule[first] === rule[(first + n - 1) % n]) first++;
  if (first === n) return false;
  for (let k = 0, run = 0; k < n; k++) {
    run++;
    if (rule[(first + k) % n] !== rule[(first + k + 1) % n]) { if (run % 2 === 1) return false; run = 0; }
  }
  return true;
}

// The start set: RL, then every rule of 3 to 5 letters that starts with R,
// has both letters and is not a shorter rule written several times (RLRL is RL), then three
// long ones. A rule that starts with L is the mirror image of one that starts with R.
function startRules() {
  const list = ['RL'];
  for (let len = 3; len <= 5; len++) for (let b = 0; b < 1 << (len - 1); b++) {
    let rule = 'R';
    for (let k = len - 2; k >= 0; k--) rule += (b >> k) & 1 ? 'R' : 'L';
    let repeat = false;
    for (let d = 1; d < len; d++) if (len % d === 0 && rule.slice(0, d).repeat(len / d) === rule) repeat = true;
    if (rule.includes('L') && !repeat) list.push(rule);
  }
  return list.concat(['LRRRRRLLR', 'LLRRRLRLRLLR', 'RRLLLRLLLRRR']);
}

function makeAnt(rule) {
  const side = START_SIDE;
  return {
    rule, n: rule.length, turn: Uint8Array.from(rule, ch => (ch === 'R' ? 1 : 3)),   // added to the heading
    grid: new Uint8Array(side * side), side, off: side >> 1,   // world cell (x,y) is grid[(y+off)*side + (x+off)]
    vis: new Uint8Array(side * side), maxVisits: 0,            // visits of each cell (255 = 255 or more), and the largest
    x: 0, y: 0, h: 0,                                          // the simulated ant, after `simulated` steps
    homeVisits: 1, lastHome: 0,                                // times it has stood on its start cell (0,0), the start counted, and the step count of the last time
    steps: 0, simulated: 0,                                    // the clock, and how much of it was really simulated
    minX: 0, maxX: 0, minY: 0, maxY: 0,                        // box of every cell the ant has stood on
    // the last HIST steps, step i at index i % HIST: colour read, and position and heading BEFORE the step
    col: new Uint8Array(HIST), px: new Int32Array(HIST), py: new Int32Array(HIST), hd: new Uint8Array(HIST),
    nextCheck: 64, nextFull: 64,   // step counts of the next look of either kind, and of the next full look
    state: 'running', proof: null, repeat: null, fake: null, lostAt: null,
    copyOf: null,                  // the rule of the proved ant this one was copied from (copyAnt), else null
  };
}

// The hot loop. The caller makes sure these steps cannot reach the edge of the grid.
function simulate(ant, count) {
  const grid = ant.grid, vis = ant.vis, side = ant.side, turn = ant.turn, last = ant.n - 1;
  const col = ant.col, px = ant.px, py = ant.py, hd = ant.hd;
  let x = ant.x, y = ant.y, h = ant.h, minX = ant.minX, maxX = ant.maxX, minY = ant.minY, maxY = ant.maxY;
  let i = (y + ant.off) * side + (x + ant.off), j = ant.simulated & HIST_MASK, most = ant.maxVisits;
  const home = ant.off * side + ant.off;   // the start cell (0,0); its index changes when the grid grows
  let homes = 0, back = 0;                 // times the ant came to stand on it in these steps, and after which of them last
  for (let s = 0; s < count; s++) {
    const c = grid[i], w = vis[i];
    col[j] = c; px[j] = x; py[j] = y; hd[j] = h; j = (j + 1) & HIST_MASK;
    h = (h + turn[c]) & 3;
    grid[i] = c === last ? 0 : c + 1;
    if (w !== 255) { vis[i] = w + 1; if (w >= most) most = w + 1; }   // one more visit; a count stops at 255
    if (h === 0) { y--; i -= side; if (y < minY) minY = y; }
    else if (h === 1) { x++; i++; if (x > maxX) maxX = x; }
    else if (h === 2) { y++; i += side; if (y > maxY) maxY = y; }
    else { x--; i--; if (x < minX) minX = x; }
    if (i === home) { homes++; back = s; }
  }
  if (homes > 0) { ant.homeVisits += homes; ant.lastHome = ant.simulated + back + 1; }
  ant.x = x; ant.y = y; ant.h = h; ant.minX = minX; ant.maxX = maxX; ant.minY = minY; ant.maxY = maxY;
  ant.simulated += count; ant.steps += count; ant.maxVisits = most;
}

// Twice the side, the old picture in the middle. Positions are world cells, so only off changes.
function grow(ant) {
  const side = ant.side, big = side * 2, add = side >> 1;
  const wider = old => {
    const cells = new Uint8Array(big * big);
    for (let row = 0; row < side; row++) cells.set(old.subarray(row * side, (row + 1) * side), (row + add) * big + add);
    return cells;
  };
  ant.grid = wider(ant.grid); ant.vis = wider(ant.vis); ant.side = big; ant.off = big >> 1;
}

function advance(ant, k) {
  k = Math.floor(k);   // whole steps only; 0, a negative number or NaN changes nothing
  if (!(k > 0) || ant.state === 'lost') return;
  while (k > 0 && ant.state === 'running') {
    // one step moves one cell, so this many steps are safe without looking at the edge again
    const gx = ant.x + ant.off, gy = ant.y + ant.off;
    const room = Math.min(gx, gy, ant.side - 1 - gx, ant.side - 1 - gy) - BORDER;
    if (room <= 0) {
      if (ant.side >= MAX_SIDE) { ant.state = 'lost'; ant.lostAt = ant.steps; ant.repeat = null; return; }
      grow(ant); continue;
    }
    const run = Math.min(k, room, ant.nextCheck - ant.steps);
    simulate(ant, run); k -= run;
    const t = ant.steps;
    if (ant.repeat !== null && t > ant.repeat.endsAt) ant.repeat = null;   // that repeat is over
    if (t < ant.nextCheck) continue;
    // Two timetables. A full look tries every period. It costs the most, so it gets rarer as the
    // ant gets older (but never more than 8192 steps apart). A quick look tries the short periods
    // only, every QUICK_EVERY steps: without it a repeat of a few thousand steps can begin and end
    // between two full looks, unseen. A quick look never moves the full timetable.
    if (t >= ant.nextFull) {
      detect(ant, MAX_PERIOD);
      ant.nextFull = t + Math.min(8192, Math.max(64, Math.floor(t / 64)));
    } else detect(ant, QUICK_PERIOD);
    ant.nextCheck = Math.min(ant.nextFull, t - t % QUICK_EVERY + QUICK_EVERY);
  }
  if (ant.state !== 'running') ant.steps += k;   // proved: the rest is skipped, not simulated
}

// detect()'s notes, kept so that it allocates nothing: matches per period, the candidate periods,
// and those the check refused
const MATCH = new Int32Array(MAX_PERIOD + 1), CAND = new Int32Array(MAX_PERIOD), REFUSED = new Int32Array(MAX_PERIOD);

// Is X (ant.repeat or ant.fake) a repeat with period p that has not ended at step T?
const running = (X, p, T) => X !== null && X.period === p && T <= X.endsAt;

// The detector. A period p is a candidate when the last 2p colours read were the same p colours
// twice. That alone means nothing (see the banner): certify() decides. maxP = the longest period to try.
function detect(ant, maxP) {
  const T = ant.simulated, col = ant.col, end = T - 1, M = HIST_MASK, len = MATCH;
  maxP = Math.min(maxP, Math.floor(T / 2));
  const span = 2 * maxP;
  // len[p] = how many of the newest colours, going back, equal the colour p steps before them
  // (inside the last 2*maxP steps). For all p in one pass: a stretch [from, to) that is known to
  // match the newest colours is not compared again (the "Z algorithm"), so the work stays small
  // even when the ant walks a long regular stretch.
  //
  // Nearly every period fails within the newest six colours, so those are tested first, in one go:
  // one test that nearly always says no costs much less than six that go either way. `newest` is
  // the newest six colours packed into one number, five bits each. `six` is the six colours p steps
  // before them, moved on by one colour per period. (& 31: a rule has at most 24 colours. With more
  // than 32, two packs could be equal by chance but never unequal by chance, and equal packs are
  // compared colour by colour anyway.)
  let newest = 0;
  for (let k = 5; k >= 0; k--) newest = (newest << 5) | (col[(end - k) & M] & 31);
  let six = newest, from = 0, to = 0, cands = 0;
  for (let p = 1; p <= maxP; p++) {
    six = (six >>> 5) | ((col[(end - 5 - p) & M] & 31) << 25);
    let z = p < to ? Math.min(to - p, len[p - from]) : 0;
    // len[p] is noted as 0 here though it may be up to 5. Too low is safe, and p >= 6 is then no candidate.
    if (z === 0 && p >= 6 && six !== newest) { len[p] = 0; continue; }
    while (p + z < span && col[(end - z) & M] === col[(end - p - z) & M]) z++;
    len[p] = z;
    if (p + z > to) { from = p; to = p + z; }
    if (z >= p) CAND[cands++] = p;
  }
  // The candidates, shortest first. The first one that is proved ends the search. Of those the check
  // refuses, remember the one that will last longest (the shorter period on a tie).
  const R = ant.repeat, F = ant.fake;
  let refused = 0, bestP = 0, bestEnd = -1, bestShift = null;
  for (let c = 0; c < cands; c++) {
    const p = CAND[c];
    // If q was refused and all of the last 2p colours keep period q, then a multiple p of q is a
    // candidate with the same end as q (the colour that breaks q breaks p). Nothing new: skip it.
    // Without this an ant on a long regular stretch tries hundreds of multiples at every check.
    let known = false;
    for (let r = 0; r < refused; r++) { const q = REFUSED[r]; if (p % q === 0 && len[q] >= 2 * p - q) known = true; }
    if (known) continue;
    // A repeat refused at an earlier look and still running: its end is exact, so it is not worked
    // out again. (An ant on a long refused stretch would pay for that at every quick look.)
    const old = running(R, p, T) ? R : running(F, p, T) ? F : null;
    let endsAt, shift;
    if (old !== null) { endsAt = old.endsAt; shift = old.shift; }
    else {
      const res = certify(ant, p);
      if (res.ok) { setProof(ant, p, res); return; }
      if (res.endsAt === null) continue;
      endsAt = res.endsAt; shift = res.shift;
    }
    if (endsAt > bestEnd) { bestP = p; bestEnd = endsAt; bestShift = shift; }
    REFUSED[refused++] = p;
  }
  if (bestP === 0) return;
  // Already noted at an earlier look: all that follows was done then, and its first step was found
  // then. (Walking back again later could come out wrong: the ring forgets.)
  if ((R !== null && R.period === bestP && R.endsAt === bestEnd) || (F !== null && F.period === bestP && F.endsAt === bestEnd)) return;
  const first = firstStep(ant, bestP), rounds = Math.floor((bestEnd - first) / bestP);
  // On show: only with a good stretch still to run, and never in place of a repeat that ends later.
  // Once on show it stays until the step it ends (advance() clears it): its end is exact, so it stays true.
  if (bestEnd - T >= Math.max(8 * bestP, 256) && (R === null || bestEnd > R.endsAt))
    ant.repeat = { period: bestP, shift: bestShift, from: first, endsAt: bestEnd };
  // The record: of the repeats noted here so far (one per look), the one that covers the most steps,
  // from its first step to its end. Only a longer one takes its place. It outlives a proof.
  if (F === null || bestEnd - first > F.endsAt - F.from) ant.fake = { period: bestP, shift: bestShift, from: first, endsAt: bestEnd, rounds };
}

// The first step of the repeat with period p that the ant is in: walk back while a step read the
// same colour as the step p after it. Not further back than the ring remembers; a repeat older
// than that began at the step returned or before it.
function firstStep(ant, p) {
  const T = ant.simulated, col = ant.col, oldest = Math.max(0, T - HIST);
  let i = T - p;
  while (i > oldest && col[(i - 1) & HIST_MASK] === col[(i - 1 + p) & HIST_MASK]) i--;
  return i;
}

// certify() keeps its notes here so that it allocates nothing: the cells one period read, in
// order of first read (F_...), and a small hash table from grid index to place in that list.
const F_X = new Int32Array(MAX_PERIOD), F_Y = new Int32Array(MAX_PERIOD);
const F_V = new Int32Array(MAX_PERIOD), F_FIRST = new Int32Array(MAX_PERIOD);   // reads in the period, offset of the first
const F_C0 = new Int32Array(MAX_PERIOD), F_SUM = new Int32Array(MAX_PERIOD);    // colour at the first read, visits by later rounds
const H_KEY = new Int32Array(4 * MAX_PERIOD), H_AT = new Int32Array(4 * MAX_PERIOD);
const NO = Object.freeze({ ok: false, endsAt: null });   // the plain no, the same object every time
// one round's cells as a list, for a proof: [dx, dy, visits] relative to where the round began
function footprint(m) {
  const list = [];
  for (let f = 0; f < m; f++) list.push([F_X[f] - F_X[0], F_Y[f] - F_Y[0], F_V[f]]);
  return list;
}

// Does the ant repeat its last p steps for ever? T = ant.simulated; round 0 is steps T-p .. T-1.
//   { ok: true, shift, cells }       proved. cells = [dx, dy, visits] per cell of one round,
//                                    relative to where round 0 began
//   { ok: false, shift, endsAt }     no: step index endsAt is the first that reads another colour
//                                    than the step p before it
//   { ok: false, endsAt: null }      no, and nothing to say about when
function certify(ant, p) {
  const T = ant.simulated, n = ant.n, grid = ant.grid, side = ant.side, off = ant.off;
  if (p < 1 || p > MAX_PERIOD || p > T) return NO;
  const start = T - p, j0 = start & HIST_MASK;
  if (ant.hd[j0] !== ant.h) return NO;   // a round must hand the heading back
  const sx = ant.x - ant.px[j0], sy = ant.y - ant.py[j0];

  // the cells round 0 read: how often (F_V), and at which offset first (F_FIRST)
  let bits = 3; while ((1 << bits) < 4 * p) bits++;
  const mask = (1 << bits) - 1, down = 32 - bits;

function compose(p) {   // cells, then the ant on top
  const c = p.ctx, v = p.view, a = p.ant, P = a.proof, k = v.z / v.s;
  const X = x => v.dx + (x - v.x0 + 0.5) * k, Y = y => v.dy + (y - v.y0 + 0.5) * k;
  c.clearRect(0, 0, p.pw, p.ph);

  const [sx, sy] = P.shift, len = Math.hypot(sx, sy), ux = sx / len, uy = sy / len, m = 9 * dpr;
  const round = Math.floor((a.steps - P.base) / P.period);

// Bring the pictures up to date. A frame redraws only as many as fit in its ms of time (always at
// least one) and goes on with the next ones in the next frame. sync = true draws everything now
// (load, resize, #demo).
let paintFrom = 0;
function paint(sync, ms) {
  const until = sync ? Infinity : performance.now() + ms;
  let drawn = 0, next = -1;
  for (let n = 0; n < panels.length; n++) {
    const i = (paintFrom + n) % panels.length, p = panels[i], a = p.ant;
    if (a.proof) {
      if (!p.frozen) freeze(p);
      if (stamp(p, sync ? Infinity : STAMP_CELLS)) p.dirty = true;
    } else {
      if (!p.view || outgrown(p)) fit(p, a.minX, a.maxX, a.minY, a.maxY, 1.15);
      if (a.simulated !== p.drawn) p.dirty = true;
    }

    }

// The repeat a panel has on show: ant.repeat or nothing. A paused page shows whatever ant.repeat
// holds. A running page decides once per repeat, in the frame in which it first sees it: on show
// only if it will last SHOW_SECS at the speed the slider is set to. (At high speed an ant goes in and
// out of short repeats many times a second, and nobody can read a word that changes every frame.)
// Once on show, a repeat stays on show until it ends, whatever the slider does after that. A repeat
// that is not put on show leaves the panel as `not proved`.
function onShow(p) {
  const a = p.ant, R = a.repeat;
  if (R === null) { p.judged = null; return null; }
  if (p.judged !== R) { p.judged = R; p.show = R.endsAt - a.steps >= SHOW_SECS * rate; }
  if (paused) p.show = true;
  return p.show ? R : null;
}

// What a panel says. `proved` only ever comes from certify(). A repeat that it refused is shown with
// the step at which it ends, for as long as it runs (see onShow()). Otherwise an unproved panel names
// the longest refused repeat that the looks have noted (ant.fake), if that one is long enough to be
// worth a line. Steps on screen count from 1.
function words(p) {
  const a = p.ant, max = p.maxChars, P = a.proof, R = onShow(p), sim = a.simulated, skip = a.steps - sim;
  // The two counters share a line, one at each end (the | stands for the gap between them). In a line
  // that is too long the labels get shorter first; only then a number is cut short (1.74M).
  const count = fitText(max, `simulated ${full(sim)}|skipped ${full(skip)}`, `sim ${full(sim)}|skip ${full(skip)}`,
    `sim ${full(sim)}|skip ${short(skip)}`, `sim ${short(sim)}|skip ${short(skip)}`).split('|');
  // A copy (copyAnt) is proved by its source's proof: `same ant as` is said for a copy and for nothing else.
  if (P) return [a.state === 'loop' ? 'loop' : 'proved', 'ok',
    fitText(max, `period ${full(P.period)} · shift ${pair(P.shift)}`, `period ${full(P.period)} · ${pair(P.shift)}`, `period ${full(P.period)}`),
    a.copyOf ? fitText(max, `same ant as ${a.copyOf}`, `same as ${a.copyOf}`)
      : fitText(max, `proved at step ${full(P.at)}`, `proved at ${full(P.at)}`, `proved at ${short(P.at)}`), count];
  // An even-run rule. The word and the first line come from the theorem; the count under them is
  // measured. The ant is simulated like any other: the theorem says what it will never do, not where
  // it will be. A repeat on show takes the second line while it runs; so does the end of the map.
  if (never(p)) {
    const back = a.homeVisits - 1;
    return ['no highway', 'nev', fitText(max, 'never a highway (theorem)', 'no highway (theorem)', 'by a theorem'),
      a.state === 'lost' ? fitText(max, `left the map at step ${full(a.lostAt)}`, `left at step ${full(a.lostAt)}`, `left at ${full(a.lostAt)}`, `left at ${short(a.lostAt)}`)
        : R ? fitText(max, `period ${full(R.period)} repeat · ends at step ${full(R.endsAt + 1)}`, `repeat ends at step ${full(R.endsAt + 1)}`, `repeat ends at ${full(R.endsAt + 1)}`, `repeat ends at ${short(R.endsAt + 1)}`)
        : fitText(max, `back at its start ${times(back)}`, `back at start ${times(back)}`, `back ${times(back)}`, `back ${short(back)} times`), count];
  }
  // what a detector that counts repeats would have fallen for; the short form is for a narrow panel.
  // Only once it is over: until then its rounds have not all happened yet.
  const F = a.fake, fake = F && a.steps > F.endsAt && F.rounds >= FAKE_ROUNDS && F.endsAt - F.from >= FAKE_STEPS
    ? fitText(max, `fake highway: ${full(F.rounds)} × period ${full(F.period)}`, `fake: ${full(F.rounds)} × period ${full(F.period)}`,
      `${full(F.rounds)} × period ${full(F.period)}`) : '';

    fitText(max, `left the map at step ${full(a.lostAt)}`, `left at step ${full(a.lostAt)}`, `left at ${full(a.lostAt)}`, `left at ${short(a.lostAt)}`), count];
  if (R) return ['repeat', 'rep', `period ${full(R.period)} repeat`,
    fitText(max, `ends at step ${full(R.endsAt + 1)}`, `ends at ${full(R.endsAt + 1)}`, `ends at ${short(R.endsAt + 1)}`), count];
  // "not proved", never "no repeat": the ant may be in a repeat that the detector has not looked at yet
  return ['not proved', '', fake, fitText(max, `not proved in ${full(a.steps)} steps`, `not proved in ${full(a.steps)}`, `not proved in ${short(a.steps)}`), count];
}
function tipText(p) {
  const a = p.ant, P = a.proof, R = onShow(p), F = a.fake, out = [`rule ${a.rule} · ${a.n} colours`];
  // The theorem is about the rule; how often the ant was back is measured (ant.homeVisits counts the start too).
  if (never(p)) {
    const back = a.homeVisits - 1;
    out.push(`even runs (${runsOf(a.rule)}): a 1995 theorem says this ant comes back to its start again and again for ever,`,
      `so it never leaves on a highway. ${back > 0 ? `Seen back ${times(back)}, last at step ${full(a.lastHome)}.` : 'Seen back 0 times so far.'}`);
  }
  if (P) {
    const now = positionAt(a, a.steps), far = positionAt(a, FAR);
    // proof.onset is the step from which the colours that the SOURCE read repeat. A copy makes the same
    // moves, but it reads its own colours (the same visit counts mod another number), and those can
    // begin to repeat at another step. So on a copy that line names the rule the number belongs to.
    out.push(a.copyOf ? `same ant as ${a.copyOf} · proved there at step ${full(P.at)}` : `proved at step ${full(P.at)}`,
      `${a.copyOf ? a.copyOf + ' ' : ''}repeats from step ${full(P.onset + 1)} · period ${full(P.period)} · shift ${pair(P.shift)}`,
      `at step ${full(a.steps)}: cell ${pair([now.x, now.y])}`);
    if (far) out.push(`at step ${full(FAR)}: cell ${pair([far.x, far.y])}`);
    // The ant never reads past the first proof.letters letters of its rule written again and again.
    // No lines for a loop (it visits its cells without end) or when the number is not exact (255).
    // More letters than a rule can have: then the sentence is about a rule written again and again.
    const L = P.letters;
    if (L < 255) out.push(`no cell is ever visited more than ${full(L)} times:`,
      L <= SHOW_LETTERS ? `any rule that starts ${a.rule.repeat(Math.ceil(L / a.n)).slice(0, L)} is this same ant`

const put = (el, text) => { if (el.textContent !== text) el.textContent = text; };
// One panel's words. hud() writes them ten times a second, which is enough for the counters.

// changes, so a panel never says `repeat` after that repeat has ended.
function say(p) {
  const a = p.ant, [word, cls, l1, l2, l3] = words(p);
  put(p.wordEl, word); p.wordEl.className = 'word ' + cls; p.el.className = 'p ' + (cls === 'off' ? '' : cls);
  put(p.lineEls[0], l1); put(p.lineEls[1], l2); put(p.lineEls[2], l3[0]); put(p.lineEls[3], l3[1]);
  p.said = a.state; p.saidRepeat = onShow(p); p.saidFake = a.fake;

const stale = p => p.ant.state !== p.said || onShow(p) !== p.saidRepeat || p.ant.fake !== p.saidFake;
function hud() {
  let proved = 0, nev = 0, sim = 0, skip = 0;

    const a = p.ant;
    if (a.proof) proved++;
    if (never(p)) nev++;
    sim += a.simulated; skip += a.steps - a.simulated;
    say(p);
  }
  put($('tp'), `${proved} of ${panels.length}`); put($('tn'), String(nev)); put($('ts'), full(sim)); put($('tk'), full(skip));
  // running: the rate the page really reached. Paused, or not measured yet (right after load, play
  // or restart): what the slider is set to, said as such.
  const set = paused || !measured, r = set ? rate : shownRate;
  put($('rate'), `${set ? 'set to ' : ''}${full(Number(r.toPrecision(3)))} steps/s`); $('rate').className = set ? 'set' : '';
  if (hover && mouse) {
    put(tipEl, tipText(hover)); tipEl.style.display = 'block';
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = clamp(mouse.x + 14, 8, innerWidth - w - 8) + 'px';
    tipEl.style.top = (mouse.y - h - 12 < 8 ? mouse.y + 18 : mouse.y - h - 12) + 'px';
  } else tipEl.style.display = 'none';
}

// The clock: every ant should stand at clock - born steps (born: see setRules()). Running ants take turns of SLICE steps
// until they are there or the frame's ms of time for them are up. The time is read after every turn
// (a whole round of turns can take longer than a fast screen's frame), and the next frame goes on
// with the next ant. Then the clock only goes as far as the slowest got. Proved ants follow for free.
let tickFrom = 0;
function tick(dt, ms) {
  const want = clock + rate * dt, goal = Math.floor(want), until = performance.now() + ms, count = panels.length;
  let idle = 0;   // ants in a row with nothing left to do: a full round of them and every ant is there
  while (idle < count) {
    if (tickFrom >= count) tickFrom = 0;
    const p = panels[tickFrom++], a = p.ant, need = a.state === 'running' ? goal - p.born - a.steps : 0;
    if (need <= 0) { idle++; continue; }
    idle = 0; advance(a, Math.min(need, SLICE));
    if (performance.now() >= until) break;

  let reached = goal;
  for (const p of panels) if (p.ant.state === 'running') reached = Math.min(reached, p.ant.steps + p.born);
  clock = reached < goal ? Math.max(clock, reached) : want;

    const a = p.ant, k = Math.floor(clock) - p.born - a.steps;
    if (a.proof && k > 0) advance(a, k);   // the skip
  }
}

function setPaused(on) {
  paused = on; $('pause').textContent = paused ? 'play' : 'pause';
  rateT = last; rateClock = clock; measured = false;
}

// frameMs is the frame interval of this screen, in ms: the shortest of the last GAPS intervals
// between two frames. The time for simulating and for drawing follows it. A frame that ran late
// lasts two or three of the screen's intervals, so the shortest one is the screen's own. An average
// is not: late frames would buy the next frames more time, and those would be late for good.
// If every frame is late, the shortest is too long as well. So every PROBE-th frame works half as
// long: if the screen is faster than frameMs says, that frame is on time and shows it.
// One interval is kept between 4 and 50 ms (the first frames, a hidden tab). The words are written
// ten times a second; a frame that writes them simulates that much shorter (hudMs, as measured the
// last time). The clock itself runs on dt, the real time since the last frame, so steps per second
// do not depend on the frame rate.
const GAPS = 32, PROBE = 32, gaps = new Float64Array(GAPS).fill(1000 / 60);
let last = 0, hudT = -1, hudMs = 0, frameMs = 1000 / 60, frames = 0;
function frame(ts) {
  const now = ts / 1000, dt = Math.min(0.05, now - last || 0.016);
  if (last > 0) { gaps[frames % GAPS] = clamp((now - last) * 1000, 4, 50); frameMs = Math.min(...gaps); }
  else { rateT = now; rateClock = clock; }   // the first frame: the speed is measured from here on
  last = now;
  const part = ++frames % PROBE === 0 ? 0.5 : 1, hudDue = now - hudT > 0.1;
  if (!paused) {
    tick(dt, part * Math.min(SIM_MAX_MS, SIM_SHARE * frameMs) - (hudDue ? hudMs : 0));
    for (const p of panels) if (stale(p)) say(p);
    if (now - rateT >= 0.25) { shownRate = Math.max(0, (clock - rateClock) / (now - rateT)); rateT = now; rateClock = clock; measured = true; }
  }
  paint(false, Math.max(PAINT_MIN_MS, part * PAINT_SHARE * frameMs));
  if (hudDue) { hudT = now; const t0 = performance.now(); hud(); hudMs = Math.min(performance.now() - t0, SIM_MAX_MS); }
  requestAnimationFrame(frame);
}

// The start rules, with the typed rule (if any) in front. A typed rule that starts like a proved ant
// is that same ant: its panel gets a copy from the first proved panel that copyAnt() accepts, proved
// at once with no step simulated.
// born: every ant stands at clock - born steps, so a typed ant is born now. A copy starts at its
// source's proof step, not at 0: positionAt() knows no place before the proof, and this way the
// marker is on the highway from the first picture on. So a copy is born proof.at steps before now.
function setRules(custom) {
  const start = panels.filter(p => !p.custom);
  if (!start.length) for (const rule of startRules()) start.push(makePanel(rule, false, makeAnt(rule)));
  panels = start;
  if (custom) {
    let ant = null;
    for (const q of start) { ant = copyAnt(custom, q.ant); if (ant !== null) break; }
    if (ant !== null) advance(ant, ant.proof.at); else ant = makeAnt(custom);
    const p = makePanel(custom, true, ant);
    p.born = Math.floor(clock) - ant.steps;
    panels = [p].concat(start);
  }
  grid.replaceChildren(...panels.map(p => p.el)); hover = null;
}
function addRule() {
  const box = $('rule'), rule = validRule(box.value);
  box.classList.toggle('bad', rule === null); box.setAttribute('aria-invalid', rule === null);
  if (rule === null) return;
  setRules(rule); layout();
}

const rateOf = v => 20 * (1e5 ** (v / 1000));   // 20 to 2,000,000 steps per second
$('spd').oninput = e => { rate = rateOf(+e.target.value); };
$('add').onclick = addRule;
$('rule').oninput = e => { e.target.classList.remove('bad'); e.target.removeAttribute('aria-invalid'); };
$('rule').onkeydown = e => { if (e.key === 'Enter') addRule(); };
$('pause').onclick = () => { setPaused(!paused); hud(); };
$('again').onclick = () => { panels.forEach(fresh); clock = 0; setPaused(false); paint(true); hud(); };
// Space is pause everywhere but in the rule box. Also on a button: after a click on restart or add
// that button keeps the focus, and Space would press it again and throw the run away.
addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.id !== 'rule') { e.preventDefault(); $('pause').click(); }
});
addEventListener('keyup', e => { if (e.code === 'Space' && e.target.tagName === 'BUTTON') e.preventDefault(); });
addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; });
document.addEventListener('mouseleave', () => { mouse = null; });
addEventListener('resize', layout);

rate = rateOf(+$('spd').value);
setRules(null);
if (demoM) {
  clock = demoM[1] ? Math.min(+demoM[1], DEMO_MAX) : DEMO_STEPS;
  for (const p of panels) advance(p.ant, clock);
  // The rule of the demo comes last, when the start ants are where they will be shown: it may be a
  // copy of one that is proved by now. In a demo every panel shows the same step, a copy too.
  const rule = validRule(demoM[2] || '');
  if (rule) { setRules(rule); const p = panels[0]; p.born = 0; advance(p.ant, clock - p.ant.steps); }
  setPaused(true);
}
layout();
requestAnimationFrame(frame);
</script>
